<body class="bg-background text-on-background font-body-md min-h-screen pb-24">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-background">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary p-2 hover:bg-surface-variant/10 transition-colors">menu</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary tracking-tighter">LogBook</h1>
</div>
<button class="material-symbols-outlined text-primary p-2 hover:bg-surface-variant/10 transition-colors">account_circle</button>
</header>
<main class="mt-16 px-margin-mobile pt-md">
<!-- Search Bar -->
<div class="relative w-full mb-md">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60">search</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-tertiary-container transition-all font-body-md" placeholder="Nome da carta..." type="text"/>
</div>
<!-- Filter Chips Row: Colors -->
<div class="flex overflow-x-auto hide-scrollbar gap-2 mb-md">
<button class="px-5 py-2 rounded-full border border-primary bg-primary text-on-primary text-label-sm whitespace-nowrap">Todas</button>
<button class="px-5 py-2 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm whitespace-nowrap hover:bg-surface-variant/20 transition-all">U</button>
<button class="px-5 py-2 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm whitespace-nowrap hover:bg-surface-variant/20 transition-all">B</button>
<button class="px-5 py-2 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm whitespace-nowrap hover:bg-surface-variant/20 transition-all">R</button>
<button class="px-5 py-2 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm whitespace-nowrap hover:bg-surface-variant/20 transition-all">Y</button>
<button class="px-5 py-2 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm whitespace-nowrap hover:bg-surface-variant/20 transition-all">G</button>
<button class="px-5 py-2 rounded-full bg-surface-container-low text-on-surface-variant text-label-sm whitespace-nowrap hover:bg-surface-variant/20 transition-all">P</button>

</div>
<!-- Expandable Filter Sections -->
<div class="space-y-4 mb-lg">
<!-- Price Range -->

<span class="font-label-md">Preço</span>
<span class="material-symbols-outlined transition-transform group-open:rotate-180">expand_more</span>
</summary>
<div class="p-4 pt-0">
<div class="flex justify-between mb-4">
<span class="text-label-sm text-on-surface-variant">R$ 0</span>
<span class="text-label-md font-bold text-primary" id="price-display">R$ 500+</span>
</div>
<input class="w-full accent-primary" max="500" min="0" oninput="document.getElementById('price-display').innerText = 'R$ ' + (this.value == 500 ? '500+' : this.value)" type="range" value="500"/>
</div>
</details>
<!-- Edição Dropdown -->
<details class="group bg-surface-container-lowest rounded-lg border border-surface-container overflow-hidden">
<summary class="flex items-center justify-between p-4 cursor-pointer list-none">
<span class="font-label-md">Edição</span>
<span class="material-symbols-outlined transition-transform group-open:rotate-180">expand_more</span>
</summary>

<span class="material-symbols-outlined transition-transform group-open:rotate-180">expand_more</span>
</summary>
<div class="p-4 pt-0 flex flex-wrap gap-2">

<button class="px-4 py-1.5 rounded-full bg-surface-container-low text-label-sm text-on-surface-variant">Uncommon</button>

<div class="px-1">

</div>

<div class="flex flex-col gap-2 group">
<div class="aspect-[2.5/3.5] rounded-lg overflow-hidden bg-surface-container-high transition-transform duration-300 group-hover:scale-[1.02] shadow-sm">

<div class="px-1">
<h3 class="font-label-md text-on-surface truncate">Uta (Promo)</h3>

</div>

</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface-container shadow-[0_-4px_12px_rgba(0,0,0,0.1)]">
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-primary-container transition-all">
<span class="material-symbols-outlined">style</span>
<span class="text-label-bold font-label-bold mt-1">Coleção</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-primary-container transition-all">
<span class="material-symbols-outlined">trending_up</span>
<span class="text-label-bold font-label-bold mt-1">Preços</span>
</button>
<button class="flex flex-col items-center justify-center text-primary scale-110 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">storefront</span>
<span class="text-label-bold font-label-bold mt-1">Mercado</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-primary-container transition-all">
<span class="material-symbols-outlined">person</span>
<span class="text-label-bold font-label-bold mt-1">Perfil</span>
</button>

<script>
        // Micro-interactions
        document.querySelectorAll('details').forEach((detail) => {
            detail.addEventListener('toggle', () => {
                if (detail.open) {
                    document.querySelectorAll('details').forEach((other) => {
                        if (other !== detail) other.removeAttribute('open');
                    });
                }
            });
        });

        // Click interaction for chips
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('px-4')) { // Specifically rarity chips
                    const isActive = this.classList.contains('border-primary');
                    if(isActive) {
                        this.classList.remove('border-primary', 'text-primary', 'font-bold');
                        this.classList.add('bg-surface-container-low', 'text-on-surface-variant');
                    } else {
                        this.classList.add('border-primary', 'text-primary', 'font-bold');
                        this.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
                    }
                }
            });
        });
    </script>
</body></html>

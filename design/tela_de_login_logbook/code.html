<script>
        // Subtle parallax/tilt effect for the main login card
        const card = document.querySelector('.glass-panel');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 100;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 100;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Form focus visual cue
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                card.style.borderColor = 'rgba(230, 57, 70, 0.4)';
                card.style.boxShadow = '0 20px 40px rgba(230, 57, 70, 0.1)';
            });
            input.addEventListener('blur', () => {
                card.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                card.style.boxShadow = '0 8px 24px rgba(0,0,0,0.5)';
            });
        });
    </script>

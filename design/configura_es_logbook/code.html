<!DOCTYPE html>

<html class="light" lang="pt-br"><head>
<meta charset="utf-8"/>

<title>Configurações - LogBook</title>

<style>
        body { font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        .toggle-checkbox:checked + .toggle-label { background-color: #b7102a; }
        .toggle-checkbox:checked + .toggle-label .toggle-dot { transform: translateX(100%); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-24">
<!-- Top AppBar (JSON Derived Mapping) -->
<header class="bg-surface border-b border-surface-variant flex items-center justify-between px-margin-mobile w-full h-16 sticky top-0 z-50">
<div class="flex items-center gap-4">
<button aria-label="Back" class="material-symbols-outlined text-primary Active:scale-95 transition-transform">arrow_back</button>
<h1 class="font-headline-md text-headline-md-mobile text-on-surface font-bold">Configurações</h1>
</div>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<main class="max-w-md mx-auto">
<!-- Profile Photo Area -->
<section class="flex flex-col items-center py-lg">
<div class="relative group cursor-pointer active:scale-95 transition-transform duration-200">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-surface-container-lowest shadow-lg">
<img alt="Avatar de usuário" class="w-full h-full object-cover" data-alt="A detailed digital illustration of a stylized pirate character for a high-end mobile app profile. The character has a friendly expression, wearing a classic leather tricorn hat and a deep red jacket that pops against a neutral, minimalist gray background. The lighting is soft and studio-quality, emphasizing the clean lines and vibrant red accents that define the LogBook app's corporate-modern aesthetic. The mood is professional yet adventurous, rendered in a sharp, high-contrast vector art style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBE3XWk4EZqckG_NizxpYA8a4DPUrIiKXOPgW373p8PbhpZ-puZ03PDNgmyzXDnyYuPWLk0snMAoRBaLNh8GJUqrRx5amDyoxIAUFDHf0nHG7PckRt70nnDtP39pVMW-a81Zul_VFH84DS63GfRLkm19kzvn8DsZS7dBz6MnTnFXjCmeuPK0gXytSb8Xeo0tESrXU-QoHOSyqgfOhcUc7T8vqeQ5Ea5kbI43a6VWBCbjorgZy62ALmajI12ru2rBrBEJzmnN5S8IQ"/>
</div>
<div class="absolute bottom-1 right-1 bg-primary text-on-primary p-2 rounded-full shadow-md border-2 border-surface">
<span class="material-symbols-outlined text-[18px] block" data-weight="fill">photo_camera</span>
</div>
</div>
<p class="mt-4 font-label-md text-on-surface-variant">@usuario_logbook</p>
</section>
<!-- Settings List -->
<div class="space-y-gutter px-margin-mobile">
<!-- Section: Conta -->
<div class="space-y-2">
<h2 class="text-primary font-label-sm uppercase tracking-widest px-2">Conta</h2>
<div class="bg-surface-container-lowest rounded-xl overflow-hidden border border-surface-variant/30">
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors border-b border-surface-variant/20 active:opacity-70">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary">mail</span>
<span class="font-body-md text-on-surface">Alterar e-mail</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors border-b border-surface-variant/20 active:opacity-70">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary">lock</span>
<span class="font-body-md text-on-surface">Alterar senha</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors border-b border-surface-variant/20 active:opacity-70 text-left">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary">badge</span>
<div>
<p class="font-body-md text-on-surface">Alterar nickname</p>
<p class="text-label-sm text-outline">Disponível a cada 30 dias</p>
</div>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors active:opacity-70">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary">add_a_photo</span>
<span class="font-body-md text-on-surface">Adicionar foto de perfil</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
</div>
</div>
<!-- Section: Aparência -->
<div class="space-y-2">
<h2 class="text-primary font-label-sm uppercase tracking-widest px-2">Aparência</h2>
<div class="bg-surface-container-lowest rounded-xl overflow-hidden border border-surface-variant/30">
<div class="flex items-center justify-between p-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary">dark_mode</span>
<span class="font-body-md text-on-surface">Modo Escuro</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only toggle-checkbox" onchange="document.documentElement.classList.toggle('dark')" type="checkbox"/>
<div class="toggle-label w-11 h-6 bg-surface-variant rounded-full transition-colors duration-200 ease-in-out">
<div class="toggle-dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-200 ease-in-out shadow-sm"></div>
</div>
</label>
</div>
</div>
</div>
<!-- Section: Notificações -->
<div class="space-y-2">
<h2 class="text-primary font-label-sm uppercase tracking-widest px-2">Notificações</h2>
<div class="bg-surface-container-lowest rounded-xl overflow-hidden border border-surface-variant/30">
<div class="flex items-center justify-between p-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary">notifications_active</span>
<span class="font-body-md text-on-surface">Notificações Push</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only toggle-checkbox" type="checkbox"/>
<div class="toggle-label w-11 h-6 bg-surface-variant rounded-full transition-colors duration-200 ease-in-out">
<div class="toggle-dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-200 ease-in-out shadow-sm"></div>
</div>
</label>
</div>
</div>
</div>
<!-- Log Out Button -->
<button class="w-full mt-lg p-4 rounded-xl border border-error text-error font-label-md flex items-center justify-center gap-2 active:bg-error/10 transition-colors">
<span class="material-symbols-outlined">logout</span>
                Sair da Conta
            </button>
<p class="text-center text-label-sm text-outline py-md">LogBook v2.4.0</p>
</div>
</main>
<!-- Bottom Navigation (JSON Derived Mapping) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface-container-lowest shadow-[0px_-2px_10px_rgba(0,0,0,0.05)] rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Início</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">menu_book</span>
<span class="font-label-sm text-label-sm">Livros</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">search</span>
<span class="font-label-sm text-label-sm">Busca</span>
</button>
<!-- Perfil Active State mapping based on Settings screen context -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 scale-90 transition-all duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm font-bold">Perfil</span>
</button>
</nav>
<script>
        // Micro-interactions for setting items
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-95');
            });
            button.addEventListener('mouseleave', () => {
                button.classList.remove('scale-95');
            });
        });
    </script>
</body></html>

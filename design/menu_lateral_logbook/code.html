<script>
        const navDrawer = document.getElementById('nav-drawer');
        const backdrop = document.getElementById('backdrop');

        // Toggle Functionality (Simulated)
        function toggleDrawer(open) {
            if (open) {
                navDrawer.style.transform = 'translateX(0)';
                backdrop.style.opacity = '1';
                backdrop.style.pointerEvents = 'auto';
            } else {
                navDrawer.style.transform = 'translateX(-100%)';
                backdrop.style.opacity = '0';
                backdrop.style.pointerEvents = 'none';
            }
        }

        backdrop.addEventListener('click', () => toggleDrawer(false));

        // Add visual feedback to menu items
        document.querySelectorAll('nav a').forEach(item => {
            item.addEventListener('touchstart', () => {
                item.style.backgroundColor = 'rgba(255, 255, 255, 0.08)';
            });
            item.addEventListener('touchend', () => {
                if(!item.classList.contains('active-pill')) {
                    item.style.backgroundColor = 'transparent';
                } else {
                    item.style.backgroundColor = 'rgba(230, 57, 70, 0.1)';
                }
            });
        });
    </script>

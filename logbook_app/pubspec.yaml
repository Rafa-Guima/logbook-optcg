name: logbook_app
description: LogBook - One Piece TCG Companion App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^12.1.3
  google_fonts: ^6.3.3
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  image_picker: ^1.2.2
  camera: ^0.10.6
  google_mlkit_text_recognition: ^0.12.0
  flutter_svg: ^2.0.9
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png" # Coloque seu arquivo app_icon.png aqui
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/